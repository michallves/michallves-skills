<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Painel de exemplo</title>
<style>body{font:20px system-ui;margin:0;background:#f1f5f9;color:#0f172a}header{background:#0f172a;color:#fff;padding:22px 40px;font-size:26px}
main{padding:40px;max-width:900px}input,button{font:inherit;padding:12px 16px;border-radius:8px;border:1px solid #94a3b8}
button{background:#e57000;color:#fff;border:0;cursor:pointer}#lista li{background:#fff;margin:10px 0;padding:14px 18px;border-radius:8px;list-style:none}</style>
<header>Painel de exemplo - versão 9.0.3</header>
<main><h2>Projetos</h2><p><input id="nome" placeholder="Nome do projeto"> <button id="criar">Criar projeto</button></p>
<ul id="lista"><li>Projeto Alfa (192.0.2.10)</li></ul></main>
<script>document.getElementById('criar').onclick=()=>{const n=document.getElementById('nome').value||'Sem nome';const li=document.createElement('li');li.textContent=n+' (criado agora)';document.getElementById('lista').appendChild(li)}</script></html>
